server {
  listen 80;
  server_name api.konkourix.ir;

  client_max_body_size 2m;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  location = /health/live {
    access_log off;
    proxy_pass http://api_upstream;
  }

  location = /health {
    access_log off;
    proxy_pass http://api_upstream;
  }

  location / {
    proxy_pass http://api_upstream;
  }
}
