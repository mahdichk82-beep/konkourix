services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - konkourix-internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-4000}
      API_URL: ${API_URL:?API_URL is required}
      STUDENT_APP_URL: ${STUDENT_APP_URL:?STUDENT_APP_URL is required}
      COUNSELOR_APP_URL: ${COUNSELOR_APP_URL:?COUNSELOR_APP_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      ACCESS_TOKEN_ISSUER: ${ACCESS_TOKEN_ISSUER:-konkourx-api}
      ACCESS_TOKEN_AUDIENCE: ${ACCESS_TOKEN_AUDIENCE:-konkourx-client}
      HEALTHCHECK_PATH: /health
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - konkourix-internal

  student-web:
    build:
      context: .
      dockerfile: apps/student-web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    expose:
      - "8080"
    networks:
      - konkourix-internal

  counselor-web:
    build:
      context: .
      dockerfile: apps/counselor-web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    expose:
      - "8080"
    networks:
      - konkourix-internal

volumes:
  postgres-data:

networks:
  konkourix-internal:
    driver: bridge
    internal: true
